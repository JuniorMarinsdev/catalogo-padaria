<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500&display=swap" rel="stylesheet">    <title>Catálogo de Produtos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="logo">
            <img src="img/logo.jpg" alt="Logo da Padaria" id="logo">
        </div>

        <h1>Catálogo de Produtos</h1>

        <input
            type="text"
            id="pesquisa"
            placeholder="🔍 Pesquisar produto..."
            autocomplete="off">

    </header>

    <section id="categorias">
        <!-- Categorias criadas automaticamente -->
    </section>

    <main id="produtos">
        <!-- Produtos serão carregados pelo JavaScript -->
    </main>

    <script src="script.js"></script>

</body>

</html>
